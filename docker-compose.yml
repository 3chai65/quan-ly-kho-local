services:
  quan-ly-kho:
    build: .
    container_name: quan-ly-kho
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # File SQLite thật nằm trên ổ cứng máy bạn tại G:\quan-ly-kho-local\data\app.db
      - ./data:/data
    environment:
      - PORT=8787
      - DATA_DIR=/data
      # Giờ VN để tên file backup (backup-YYYY-MM-DD.db) đúng ngày địa phương.
      - TZ=Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/state').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
