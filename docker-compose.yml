services:
  quan-ly-kho:
    build: .
    container_name: quan-ly-kho
    restart: unless-stopped
    ports:
      - "8787:8787"
    volumes:
      # File SQLite thật nằm trên ổ cứng máy bạn tại G:\quan-ly-kho-local\data\app.db
      - ./data:/data
    environment:
      - PORT=8787
      - DATA_DIR=/data
      # Giờ VN để tên file backup (backup-YYYY-MM-DD.db) đúng ngày địa phương.
      - TZ=Asia/Ho_Chi_Minh
