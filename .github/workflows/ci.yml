name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-quan-ly-kho-local
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Test logic client (chạy trên host, không cần dependency ngoài).
  test-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run client tests
        run: node --test --test-timeout=120000 tests/client.test.mjs

  # Build image rồi test server.js thật bên trong container.
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t quan-ly-kho-local:ci .

      - name: Run server tests in container
        run: docker run --rm -e DATA_DIR=/tmp/qlk-ci quan-ly-kho-local:ci npm test

      - name: Run auth tests in container
        run: docker run --rm -e DATA_DIR=/tmp/qlk-ci quan-ly-kho-local:ci npm run test:auth

  # Kiểm cú pháp server/auth/pwa và script client (không cần dependency).
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint cú pháp
        run: npm run lint
